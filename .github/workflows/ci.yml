# Builds Strayta and runs the tests on macOS, Windows and Linux for every pull request, and (called from the
# release workflow) before every nightly build and release.
# The timed tests (Trait Category=Performance) are left out, as in a normal `dotnet test`; shared CI machines are
# too noisy for them. The editor's self-test needs a display and the private PSD corpus, so it is not run here.
name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Linux libraries for SkiaSharp
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Build
        run: dotnet build -c Release

      - name: Test
        shell: bash
        env:
          NO_COLOR: '1'
        run: dotnet test -c Release --no-build --no-ansi 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}

      # Job logs are only visible to signed-in users; annotations are public, so each failing test (with the lines
      # under it) becomes one annotation. Colour codes are stripped in case any remain.
      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: |
          sed -E 's/\x1b\[[0-9;]*[A-Za-z]//g' test-output.txt | awk '
            function flush() { if (msg != "") { print "::error title=Test failure (" os ")::" msg; msg = "" } }
            /^[[:space:]]*failed / { flush(); msg = $0; n = 0; next }
            msg != "" && n < 12 { gsub(/%/, "%25"); msg = msg "%0A" $0; n++; next }
            msg != "" { flush() }
            END { flush() }' os="${{ runner.os }}"
