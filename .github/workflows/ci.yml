# Builds Strayta and runs the tests on macOS, Windows and Linux for every push to main and every pull request.
# The timed tests (Trait Category=Performance) are left out, as in a normal `dotnet test`; shared CI machines are
# too noisy for them. The editor's self-test needs a display and the private PSD corpus, so it is not run here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'Directory.Build.props', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Linux libraries for SkiaSharp
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1

      - name: Build
        run: dotnet build -c Release

      - name: Test
        shell: bash
        run: dotnet test -c Release --no-build 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}

      # Job logs are only visible to signed-in users; annotations are public, so failing tests are copied there.
      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: |
          grep -E -A6 '^(failed|  failed) ' test-output.txt | head -c 60000 | while IFS= read -r line; do
            echo "::error title=Test failure (${{ runner.os }})::${line}"
          done || true
