# Builds release packages when a version tag (v1.2.3) is pushed and attaches them to a draft GitHub Release:
#   macOS: Strayta.app in a .dmg for Apple silicon and Intel, signed with the Developer ID certificate and notarized.
#   Windows: a .zip of the app (signed with Azure Trusted Signing once it is set up; see the Windows job).
#   Linux: a .tar.gz of the app.
# The jobs run in the "release" environment: give it required reviewers (Settings › Environments) so a release
# waits for approval before any signing secret is used. Secrets (Settings › Secrets and variables › Actions, on the
# repository or the organization):
#   MACOS_CERT_P12            base64 of the Developer ID Application certificate + private key exported as .p12
#   MACOS_CERT_PASSWORD       the .p12's password
#   ASC_KEY_P8                contents of the App Store Connect API key (.p8) used for notarization
#   ASC_KEY_ID, ASC_ISSUER_ID that key's ID and issuer ID
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  macos:
    name: macOS (${{ matrix.arch }})
    runs-on: macos-latest
    environment: release
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: AI selection models
        uses: actions/cache@v4
        with:
          path: models/*.onnx
          key: models-${{ hashFiles('tools/FetchModels.proj') }}
      - run: dotnet build tools/FetchModels.proj

      # Which secrets reach this job, by length only (a length reveals nothing; empty means not visible here:
      # misnamed, stored as a variable, or an organization secret whose access excludes this public repository).
      - name: Secrets visible to this job
        env:
          S1: ${{ secrets.MACOS_CERT_P12 }}
          S2: ${{ secrets.MACOS_CERT_PASSWORD }}
          S3: ${{ secrets.ASC_KEY_P8 }}
          S4: ${{ secrets.ASC_KEY_ID }}
          S5: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "::notice title=Secrets visible (environment: release)::MACOS_CERT_P12=${#S1} MACOS_CERT_PASSWORD=${#S2} ASC_KEY_P8=${#S3} ASC_KEY_ID=${#S4} ASC_ISSUER_ID=${#S5} characters"

      - name: Signing keychain
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # Each check reports what is wrong as a public annotation (job logs need a signed-in viewer); none of
          # them prints a secret.
          fail() { echo "::error title=Signing setup::$1"; exit 1; }
          [ -n "$MACOS_CERT_P12" ] || fail "The MACOS_CERT_P12 secret is empty or missing (add it to the release environment or the repository)."
          [ -n "$MACOS_CERT_PASSWORD" ] || fail "The MACOS_CERT_PASSWORD secret is empty or missing."
          printf '%s' "$MACOS_CERT_P12" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/cert.p12" 2>/dev/null \
            || fail "MACOS_CERT_P12 is not valid base64 (paste the output of: base64 -i file.p12 | pbcopy)."
          size=$(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ')
          [ "$size" -gt 500 ] || fail "MACOS_CERT_P12 decodes to only $size bytes; it is not a .p12 export."
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:MACOS_CERT_PASSWORD -noout -legacy 2>/dev/null \
            || openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:MACOS_CERT_PASSWORD -noout 2>/dev/null \
            || fail "The .p12 does not open with MACOS_CERT_PASSWORD (wrong password, or not a .p12)."
          keys=$( (openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:MACOS_CERT_PASSWORD -nocerts -nodes -legacy 2>/dev/null \
                   || openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:MACOS_CERT_PASSWORD -nocerts -nodes 2>/dev/null) | grep -c 'PRIVATE KEY-----' || true)
          [ "$keys" -gt 0 ] || fail "The .p12 has no private key: export the certificate line (with its key underneath) from My Certificates."
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          out=$(security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign 2>&1) \
            || fail "Importing the certificate failed: $out"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ids=$(security find-identity -v -p codesigning "$keychain")
          echo "$ids" | grep -q "Developer ID Application" \
            || fail "The certificate imported but is not a valid Developer ID Application identity: $(echo "$ids" | tail -1)"

      - name: Package, sign and notarize
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          STRAYTA_NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          STRAYTA_NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          export STRAYTA_VERSION="${GITHUB_REF_NAME#v}"
          export STRAYTA_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
          echo "$ASC_KEY_P8" > "$STRAYTA_NOTARY_KEY"
          zsh tools/package-mac.sh --arch ${{ matrix.arch }} --out "$RUNNER_TEMP/out"
          rm "$STRAYTA_NOTARY_KEY"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ runner.temp }}/out/*.dmg

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build tools/FetchModels.proj
      - name: Publish
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          dotnet publish apps/Strayta.Editor/Strayta.Editor.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=$version -p:DebugType=none -o "$env:RUNNER_TEMP/Strayta"
      # Azure Trusted Signing goes here once the account exists (azure/trusted-signing-action, signing
      # $env:RUNNER_TEMP/Strayta/Strayta.exe and the native DLLs). Until then the build is unsigned.
      - name: Zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          Compress-Archive -Path "$env:RUNNER_TEMP/Strayta/*" -DestinationPath "$env:RUNNER_TEMP/Strayta-$version-win-x64.zip"
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ runner.temp }}/Strayta-*-win-x64.zip

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build tools/FetchModels.proj
      - name: Publish and archive
        run: |
          version="${GITHUB_REF_NAME#v}"
          dotnet publish apps/Strayta.Editor/Strayta.Editor.csproj -c Release -r linux-x64 --self-contained true \
            -p:Version="$version" -p:DebugType=none -o "$RUNNER_TEMP/Strayta"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/Strayta-$version-linux-x64.tar.gz" Strayta
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: ${{ runner.temp }}/Strayta-*-linux-x64.tar.gz
