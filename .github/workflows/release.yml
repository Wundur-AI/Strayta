# Builds the downloads and publishes them:
#   - every push to main (a merged pull request): after the tests pass, the rolling "Nightly" pre-release is replaced
#     with builds of that commit (version <next>-nightly.<run>);
#   - a version tag (v1.2.3, or v1.2.3-rc1 for a pre-release): a GitHub Release with generated notes.
# macOS: Strayta.app in a .dmg for Apple silicon and Intel: Developer ID signed and notarized when the signing secrets
# below reach this repository, otherwise unsigned (signed ad hoc; first launch needs right-click › Open). Windows: a .zip
# (signed with Azure Trusted Signing once it is set up). Linux: a .tar.gz. Every release carries SHA256SUMS.txt.
# Signing secrets (organization or repository secrets; the workflow never runs for pull requests from forks):
#   MACOS_CERT_P12            base64 of the Developer ID Application certificate + private key exported as .p12
#   MACOS_CERT_PASSWORD       the .p12's password
#   ASC_KEY_P8                contents of the App Store Connect API key (.p8) used for notarization
#   ASC_KEY_ID, ASC_ISSUER_ID that key's ID and issuer ID
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A newer merge supersedes a nightly build still in progress; releases always finish.
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      kind: ${{ steps.v.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            [[ "$version" == *-* ]] && kind=prerelease || kind=release
          else
            base=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props | head -1)
            version="$base-nightly.$GITHUB_RUN_NUMBER"
            kind=nightly
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "::notice title=Building::$version ($kind)"

  test:
    uses: ./.github/workflows/ci.yml

  macos:
    name: macOS (${{ matrix.arch }})
    needs: [version, test]
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the build number is the commit count

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: AI selection models
        uses: actions/cache@v4
        with:
          path: models/*.onnx
          key: models-${{ hashFiles('tools/FetchModels.proj') }}
      - run: dotnet build tools/FetchModels.proj

      # Which secrets reach this job, by length only (a length reveals nothing; empty means not visible here:
      # misnamed, stored as a variable, or an organization secret whose access excludes this repository).
      - name: Secrets visible to this job
        id: secrets
        env:
          S1: ${{ secrets.MACOS_CERT_P12 }}
          S2: ${{ secrets.MACOS_CERT_PASSWORD }}
          S3: ${{ secrets.ASC_KEY_P8 }}
          S4: ${{ secrets.ASC_KEY_ID }}
          S5: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          echo "::notice title=Secrets visible::MACOS_CERT_P12=${#S1} MACOS_CERT_PASSWORD=${#S2} ASC_KEY_P8=${#S3} ASC_KEY_ID=${#S4} ASC_ISSUER_ID=${#S5} characters"
          # No certificate: an unsigned build rather than a failed one.
          if [ -n "$S1" ]; then echo "sign=true" >> "$GITHUB_OUTPUT"
          else echo "::notice title=Unsigned build::No MACOS_CERT_P12 secret: the disk images are signed ad hoc and not notarized."; fi

      - name: Signing keychain
        if: steps.secrets.outputs.sign == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          # Each check reports what is wrong as a public annotation (job logs need a signed-in viewer); none of
          # them prints a secret.
          fail() { echo "::error title=Signing setup::$1"; exit 1; }
          [ -n "$MACOS_CERT_P12" ] || fail "The MACOS_CERT_P12 secret is empty or missing."
          [ -n "$MACOS_CERT_PASSWORD" ] || fail "The MACOS_CERT_PASSWORD secret is empty or missing."
          printf '%s' "$MACOS_CERT_P12" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/cert.p12" 2>/dev/null \
            || fail "MACOS_CERT_P12 is not valid base64 (paste the output of: base64 -i file.p12 | pbcopy)."
          size=$(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ')
          [ "$size" -gt 500 ] || fail "MACOS_CERT_P12 decodes to only $size bytes; it is not a .p12 export."
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:MACOS_CERT_PASSWORD -noout -legacy 2>/dev/null \
            || openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:MACOS_CERT_PASSWORD -noout 2>/dev/null \
            || fail "The .p12 does not open with MACOS_CERT_PASSWORD (wrong password, or not a .p12)."
          keys=$( (openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:MACOS_CERT_PASSWORD -nocerts -nodes -legacy 2>/dev/null \
                   || openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin env:MACOS_CERT_PASSWORD -nocerts -nodes 2>/dev/null) | grep -c 'PRIVATE KEY-----' || true)
          [ "$keys" -gt 0 ] || fail "The .p12 has no private key: export the certificate line (with its key underneath) from My Certificates."
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          out=$(security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign 2>&1) \
            || fail "Importing the certificate failed: $out"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          ids=$(security find-identity -v -p codesigning "$keychain")
          echo "$ids" | grep -q "Developer ID Application" \
            || fail "The certificate imported but is not a valid Developer ID Application identity: $(echo "$ids" | tail -1)"

      - name: Package, sign and notarize
        env:
          SIGN: ${{ steps.secrets.outputs.sign }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          STRAYTA_NOTARY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          STRAYTA_NOTARY_ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          STRAYTA_VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "$SIGN" = true ] && [ -n "$ASC_KEY_P8" ]; then
            export STRAYTA_NOTARY_KEY="$RUNNER_TEMP/notary.p8"
            echo "$ASC_KEY_P8" > "$STRAYTA_NOTARY_KEY"
          fi
          zsh tools/package-mac.sh --arch ${{ matrix.arch }} --out "$RUNNER_TEMP/out"
          rm -f "$RUNNER_TEMP/notary.p8"
          mkdir -p dist && cp "$RUNNER_TEMP"/out/*.dmg dist/

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: strayta-macos-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Windows (x64)
    needs: [version, test]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build tools/FetchModels.proj
      - name: Publish
        shell: pwsh
        run: |
          dotnet publish apps/Strayta.Editor/Strayta.Editor.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=${{ needs.version.outputs.version }} -p:DebugType=none -o "$env:RUNNER_TEMP/Strayta"
      # Azure Trusted Signing goes here once the account exists (azure/trusted-signing-action, signing
      # $env:RUNNER_TEMP/Strayta/Strayta.exe and the native DLLs). Until then the build is unsigned.
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "$env:RUNNER_TEMP/Strayta/*" -DestinationPath "dist/Strayta-${{ needs.version.outputs.version }}-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: strayta-windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  linux:
    name: Linux (x64)
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build tools/FetchModels.proj
      - name: Publish and archive
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          dotnet publish apps/Strayta.Editor/Strayta.Editor.csproj -c Release -r linux-x64 --self-contained true \
            -p:Version="$VERSION" -p:DebugType=none -o "$RUNNER_TEMP/Strayta"
          mkdir -p dist
          tar -C "$RUNNER_TEMP" -czf "dist/Strayta-$VERSION-linux-x64.tar.gz" Strayta
      - uses: actions/upload-artifact@v4
        with:
          name: strayta-linux-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [version, macos, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      KIND: ${{ needs.version.outputs.kind }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: strayta-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # The rolling nightly: the old release and its tag are replaced by this commit's builds.
      - name: Publish the nightly
        if: env.KIND == 'nightly'
        run: |
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create nightly dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Nightly ($VERSION)" \
            --notes "Built automatically from the latest commit on main ($GITHUB_SHA). Untested beyond the automated tests; for trying the newest changes. Stable versions are the numbered releases."

      - name: Publish the release
        if: env.KIND != 'nightly'
        run: |
          flags=()
          [[ "$KIND" == prerelease ]] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Strayta $VERSION" --generate-notes "${flags[@]}"
